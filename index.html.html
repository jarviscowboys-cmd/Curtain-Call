<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Curtain Call: a diary of plays and musicals</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&display=swap">
<style>
:root{--bg:#e4eaf0;--surface:#fbf7ea;--ink:#1d2a3d;--mute:#56627a;--line:#c3ccd8;--gilt:#9a741a;--acc:#7a1f2b;--on-acc:#fbf7ea;--star:#9a741a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101828;--surface:#1a2640;--ink:#efe6d0;--mute:#a6b0c4;--line:#33415f;--gilt:#d4af5a;--acc:#9b2f40;--on-acc:#fbf3de;--star:#d4af5a}}
:root[data-theme="dark"]{--bg:#101828;--surface:#1a2640;--ink:#efe6d0;--mute:#a6b0c4;--line:#33415f;--gilt:#d4af5a;--acc:#9b2f40;--on-acc:#fbf3de;--star:#d4af5a}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:500 18px/1.5 "Cormorant Garamond",Georgia,serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
h1,h2,h3{font-family:"Cormorant Garamond",Georgia,serif;font-weight:700;margin:0;line-height:1.1}
header{background:var(--bg);border-bottom:4px double var(--gilt)}
.wrap{max-width:960px;margin:0 auto;padding:0 18px}
.top{display:flex;flex-direction:column;align-items:center;padding:22px 0 6px;gap:2px}
.brand{font-size:2.6rem;font-style:italic;font-weight:600;letter-spacing:-.01em}
.brand span{color:var(--acc)}
#count{font-style:italic}
nav{display:flex;gap:26px;justify-content:center;overflow-x:auto}
nav button{background:none;border:0;border-bottom:2px solid transparent;color:var(--mute);font:600 1.15rem "Cormorant Garamond",serif;padding:6px 0 10px;cursor:pointer;white-space:nowrap}
nav button[aria-current=true]{color:var(--ink);border-bottom-color:var(--gilt)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
main{padding:26px 0 70px}
.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:center;margin-bottom:26px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--gilt);border-radius:2px;padding:7px 10px}
input[type=search]{flex:1;min-width:170px;max-width:340px}
.chips{display:flex;gap:16px}
.chip{border:0;border-bottom:2px solid transparent;background:none;color:var(--mute);padding:2px 0;font:600 1.1rem "Cormorant Garamond",serif;font-style:italic;cursor:pointer}
.chip[aria-pressed=true]{color:var(--ink);border-bottom-color:var(--gilt)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.poster{position:relative;aspect-ratio:2/3;border-radius:1px;padding:22px 16px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:8px;color:#f6edd4;cursor:pointer;border:0;overflow:hidden;font:inherit;width:100%;box-shadow:0 2px 6px rgba(16,24,40,.25)}
.poster::before{content:"";position:absolute;inset:6px;border:1px solid #d4af5a;pointer-events:none}
.poster::after{content:"";position:absolute;inset:10px;border:1px solid rgba(212,175,90,.4);pointer-events:none}
.poster:hover{filter:brightness(1.14)}
.poster .orn{color:#d4af5a;font-size:1.3rem;line-height:1;opacity:.55}
.poster.seen .orn{opacity:1}
.poster .t{font-weight:700;font-size:1.32rem;line-height:1.05;font-style:italic}
.poster .m{font-size:.85rem;opacity:.8;line-height:1.2}
.poster .badge{position:absolute;top:16px;left:0;right:0;text-align:center;font-size:.9rem;color:#d4af5a}
.row{display:flex;gap:16px;align-items:flex-start;padding:16px 0;border-bottom:1px solid var(--line)}
.row .poster{width:58px;flex:none;padding:4px}
.row .poster::before,.row .poster::after,.row .poster .badge,.row .poster .m,.row .poster .orn{display:none}
.row .poster .t{font-size:.6rem}
.row h3{font-size:1.5rem;font-style:italic}
.sub{color:var(--mute);font-size:.95rem}
.stars{color:var(--star);letter-spacing:2px;white-space:nowrap}
.empty{color:var(--mute);padding:36px 0;text-align:center;font-style:italic}
.stats{display:flex;gap:40px;flex-wrap:wrap;justify-content:center;margin-bottom:30px}
.stat{font-size:1rem;color:var(--mute);text-align:center;font-style:italic}
.stat b{display:block;font:600 2.4rem "Cormorant Garamond",serif;color:var(--ink);font-style:normal}
.bar{display:flex;align-items:center;gap:8px;font-size:.95rem;margin:3px 0}
.bar i{display:block;height:8px;background:var(--gilt)}
dialog{border:1px solid var(--gilt);border-radius:2px;background:var(--surface);color:var(--ink);padding:0;width:min(500px,calc(100% - 24px));max-height:90vh}
dialog::backdrop{background:rgba(8,12,22,.65)}
.dh{padding:26px 22px 20px;color:#f6edd4;border-bottom:4px double #d4af5a;text-align:center}
.dh h2{font-size:2.1rem;font-style:italic}
.db{padding:18px 22px 22px;display:grid;gap:14px}
label{font-size:1rem;color:var(--mute);display:grid;gap:4px;font-style:italic}
.starpick{display:inline-flex;font-size:2rem;cursor:pointer;user-select:none;touch-action:manipulation}
.starpick span{position:relative;width:1.1em;text-align:center;color:var(--line)}
.starpick span.f{color:var(--star)}
.starpick span.h{color:var(--star);clip-path:inset(0 50% 0 0);position:absolute;inset:0}
.starpick span.h::before{content:"★";color:var(--line);position:absolute}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--gilt);background:var(--surface);color:var(--ink);border-radius:2px;padding:7px 16px;font:700 1.05rem "Cormorant Garamond",serif;cursor:pointer}
.btn.p{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.btn.on{background:var(--gilt);color:var(--surface)}
.sec{margin:0 0 10px;font-size:1.6rem;font-style:italic;text-align:center}
</style>
</head>
<body>
<header><div class="wrap">
<div class="top"><h1 class="brand">Curtain <span>Call</span></h1><span class="sub" id="count"></span></div>
<nav id="nav"></nav>
</div></header>
<main class="wrap" id="main"></main>
<dialog id="dlg"></dialog>

<script>
const SEED=[
["Hamilton","musical",2015,"Lin-Manuel Miranda"],["Wicked","musical",2003,"Stephen Schwartz"],["Les Misérables","musical",1980,"Boublil & Schönberg"],
["The Phantom of the Opera","musical",1986,"Andrew Lloyd Webber"],["Rent","musical",1996,"Jonathan Larson"],["Chicago","musical",1975,"Kander & Ebb"],
["Cabaret","musical",1966,"Kander & Ebb"],["West Side Story","musical",1957,"Bernstein & Sondheim"],["Sweeney Todd","musical",1979,"Stephen Sondheim"],
["Into the Woods","musical",1987,"Stephen Sondheim"],["Dear Evan Hansen","musical",2015,"Pasek & Paul"],["The Book of Mormon","musical",2011,"Parker, Stone & Lopez"],
["Hadestown","musical",2019,"Anaïs Mitchell"],["Come From Away","musical",2017,"Hein & Sankoff"],["Fun Home","musical",2015,"Tesori & Kron"],
["Next to Normal","musical",2009,"Kitt & Yorkey"],["A Chorus Line","musical",1975,"Hamlisch & Kleban"],["The Lion King","musical",1997,"Elton John & Tim Rice"],
["Six","musical",2019,"Marlow & Moss"],["Hairspray","musical",2002,"Shaiman & Wittman"],["Oklahoma!","musical",1943,"Rodgers & Hammerstein"],["Company","musical",1970,"Stephen Sondheim"],
["Hamlet","play",1603,"William Shakespeare"],["Macbeth","play",1606,"William Shakespeare"],["A Streetcar Named Desire","play",1947,"Tennessee Williams"],
["Death of a Salesman","play",1949,"Arthur Miller"],["The Crucible","play",1953,"Arthur Miller"],["Angels in America","play",1991,"Tony Kushner"],
["Who’s Afraid of Virginia Woolf?","play",1962,"Edward Albee"],["Waiting for Godot","play",1953,"Samuel Beckett"],["Fences","play",1985,"August Wilson"],
["The Importance of Being Earnest","play",1895,"Oscar Wilde"],["Our Town","play",1938,"Thornton Wilder"],["An Inspector Calls","play",1945,"J. B. Priestley"],
["Long Day’s Journey into Night","play",1956,"Eugene O’Neill"],["Arcadia","play",1993,"Tom Stoppard"],["Noises Off","play",1982,"Michael Frayn"],
["Hamilton’s Pharmacopeia","play",0,""]].slice(0,-1).map((s,i)=>({id:"s"+i,title:s[0],type:s[1],year:s[2],by:s[3]}));

const KEY="curtaincall.v1";
let S={logs:{},watch:{},custom:[]};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const all=()=>SEED.concat(S.custom);
const get=id=>all().find(s=>s.id===id);
const esc=t=>String(t??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hue=t=>{let h=0;for(const c of t)h=(h*31+c.charCodeAt(0))%360;return h};
const PAL=["#6e1f2c","#1f3550","#26483a","#4a2c55","#5a3a1e","#1b2a4a","#4a2230","#2a4a4f"];const bg=t=>PAL[hue(t)%PAL.length];
const stars=r=>{if(!r)return"";const f=Math.floor(r);return "★".repeat(f)+(r%1?"½":"")};
let tab="discover",q="",ft="all",sort="title";

const tabs=[["discover","Discover"],["diary","Diary"],["watch","Watchlist"],["stats","Stats"]];
function nav(){document.getElementById("nav").innerHTML=tabs.map(t=>`<button data-t="${t[0]}" aria-current="${tab===t[0]}">${t[1]}</button>`).join("");
document.getElementById("count").textContent=Object.keys(S.logs).length+" logged"}
document.getElementById("nav").onclick=e=>{const t=e.target.dataset.t;if(t){tab=t;render()}};

function poster(s,extra=""){const l=S.logs[s.id];
return `<button class="poster ${l?"seen":""}" data-id="${s.id}" style="background:${bg(s.title)}" aria-label="${esc(s.title)}">
${l&&l.rating?`<span class="badge">${stars(l.rating)}</span>`:""}
<span class="orn" aria-hidden="true">❦</span><span class="t">${esc(s.title)}</span><span class="m">${esc(s.by)}${s.year?" · "+s.year:""}</span></button>`}

function discover(){
let list=all().filter(s=>(ft==="all"||s.type===ft)&&(s.title+" "+s.by).toLowerCase().includes(q.toLowerCase()));
list.sort((a,b)=>sort==="title"?a.title.localeCompare(b.title):sort==="new"?b.year-a.year:a.year-b.year);
return `<div class="controls">
<input type="search" id="q" placeholder="Search shows or writers" value="${esc(q)}" aria-label="Search">
<div class="chips">${["all","musical","play"].map(k=>`<button class="chip" data-f="${k}" aria-pressed="${ft===k}">${k==="all"?"All":k==="musical"?"Musicals":"Plays"}</button>`).join("")}</div>
<select id="sort" aria-label="Sort"><option value="title">A to Z</option><option value="new" ${sort==="new"?"selected":""}>Newest first</option><option value="old" ${sort==="old"?"selected":""}>Oldest first</option></select>
<button class="btn p" id="add">Suggest a show</button></div>
${list.length?`<div class="grid">${list.map(s=>poster(s)).join("")}</div>`:`<p class="empty">No matches. Use “Suggest a show” to recommend it.</p>`}`}

function diary(){
const ids=Object.keys(S.logs).filter(id=>get(id)).sort((a,b)=>(S.logs[b].date||"").localeCompare(S.logs[a].date||""));
if(!ids.length)return `<p class="empty">Nothing logged yet. Open a show in Discover and tap “Log it.”</p>`;
return ids.map(id=>{const s=get(id),l=S.logs[id];return `<div class="row">${poster(s)}<div style="flex:1;min-width:0">
<h3>${esc(s.title)}</h3><div class="stars">${stars(l.rating)}${l.liked?' <span>♥</span>':""}</div>
<div class="sub">${l.date?new Date(l.date+"T12:00").toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"}):"No date"}</div>
${l.review?`<p style="margin:6px 0 0">${esc(l.review)}</p>`:""}</div></div>`}).join("")}

function watch(){
const ids=Object.keys(S.watch).filter(id=>S.watch[id]&&get(id));
return ids.length?`<div class="grid">${ids.map(id=>poster(get(id))).join("")}</div>`:`<p class="empty">Your watchlist is empty. Open a show and tap “Want to see.”</p>`}

function stats(){
const ids=Object.keys(S.logs).filter(get);if(!ids.length)return `<p class="empty">Log a few shows and your stats will appear here.</p>`;
const rated=ids.filter(i=>S.logs[i].rating);const avg=rated.length?(rated.reduce((a,i)=>a+S.logs[i].rating,0)/rated.length).toFixed(1):"–";
const mus=ids.filter(i=>get(i).type==="musical").length;
const dist={};for(let r=1;r<=5;r+=.5)dist[r]=0;rated.forEach(i=>dist[S.logs[i].rating]++);const mx=Math.max(1,...Object.values(dist));
const yrs={};ids.forEach(i=>{const y=(S.logs[i].date||"").slice(0,4);if(y)yrs[y]=(yrs[y]||0)+1});
const top=rated.sort((a,b)=>S.logs[b].rating-S.logs[a].rating).slice(0,5);
return `<div class="stats"><div class="stat"><b>${ids.length}</b>shows seen</div><div class="stat"><b>${mus} / ${ids.length-mus}</b>musicals / plays</div><div class="stat"><b>${avg}</b>average rating</div></div>
<h2 class="sec">Ratings</h2>${Object.keys(dist).reverse().map(r=>`<div class="bar"><span style="width:3.2em">${r}★</span><i style="width:${dist[r]/mx*60}%;min-width:${dist[r]?4:0}px"></i><span>${dist[r]||""}</span></div>`).join("")}
${Object.keys(yrs).length?`<h2 class="sec" style="margin-top:24px">By year</h2>${Object.keys(yrs).sort().reverse().map(y=>`<div class="bar"><span style="width:3.2em">${y}</span><i style="width:${yrs[y]*12}px"></i><span>${yrs[y]}</span></div>`).join("")}`:""}
${top.length?`<h2 class="sec" style="margin-top:24px">Your top rated</h2><div class="grid">${top.map(i=>poster(get(i))).join("")}</div>`:""}`}

function render(){nav();const m=document.getElementById("main");m.innerHTML={discover,diary,watch,stats}[tab]();
const qi=document.getElementById("q");if(qi&&document.activeElement===document.body&&q){}}
document.getElementById("main").addEventListener("click",e=>{
const p=e.target.closest("[data-id]");if(p)return open(p.dataset.id);
const f=e.target.closest("[data-f]");if(f){ft=f.dataset.f;render()}
if(e.target.id==="add")addShow()});
document.getElementById("main").addEventListener("input",e=>{if(e.target.id==="q"){q=e.target.value;const pos=e.target.selectionStart;render();const n=document.getElementById("q");n.focus();n.setSelectionRange(pos,pos)}});
document.getElementById("main").addEventListener("change",e=>{if(e.target.id==="sort"){sort=e.target.value;render()}});

const dlg=document.getElementById("dlg");
let draft;
function open(id){const s=get(id);draft=Object.assign({rating:0,review:"",date:new Date().toISOString().slice(0,10),liked:false},S.logs[id]||{});
dlg.dataset.id=id;
dlg.innerHTML=`<div class="dh" style="background:${bg(s.title)}"><h2>${esc(s.title)}</h2><div style="opacity:.85">${s.type==="musical"?"Musical":"Play"}${s.by?" by "+esc(s.by):""}${s.year?", "+s.year:""}</div></div>
<div class="db"><div><div class="sub">Your rating</div><div class="starpick" id="sp" role="slider" aria-label="Rating" aria-valuemin="0" aria-valuemax="5"></div></div>
<label>Date seen<input type="date" id="d" value="${draft.date}"></label>

<label>Review<textarea id="r" rows="3" placeholder="What stayed with you?">${esc(draft.review)}</textarea></label>
<div class="btns"><button class="btn ${draft.liked?"on":""}" id="lk">${draft.liked?"♥ Liked":"♡ Like"}</button>
<button class="btn ${S.watch[id]?"on":""}" id="wl">${S.watch[id]?"On watchlist":"Want to see"}</button></div>
<div class="btns"><button class="btn p" id="sv">${S.logs[id]?"Update log":"Log it"}</button>${S.logs[id]?'<button class="btn" id="rm">Remove from diary</button>':""}<button class="btn" id="cl">Close</button></div></div>`;
paint();dlg.showModal()}
function paint(){const sp=dlg.querySelector("#sp");sp.setAttribute("aria-valuenow",draft.rating);
sp.innerHTML=[1,2,3,4,5].map(i=>draft.rating>=i?`<span class="f">★</span>`:draft.rating===i-.5?`<span style="position:relative">★<span class="h">★</span></span>`:`<span>★</span>`).join("")}
dlg.addEventListener("click",e=>{
const id=dlg.dataset.id,t=e.target;
const star=t.closest(".starpick span:not(.h)");
if(star&&!t.matches("#sv")){const sp=dlg.querySelector("#sp");const spans=[...sp.children];const idx=spans.indexOf(star.closest(".starpick > span"));const rc=spans[idx].getBoundingClientRect();
let v=idx+(e.clientX-rc.left<rc.width/2?.5:1);if(v===draft.rating)v=0;draft.rating=v;paint();return}
if(t.id==="cl")dlg.close();
if(t.id==="lk"){draft.liked=!draft.liked;t.textContent=draft.liked?"♥ Liked":"♡ Like";t.classList.toggle("on",draft.liked)}
if(t.id==="wl"){S.watch[id]=!S.watch[id];t.textContent=S.watch[id]?"On watchlist":"Want to see";t.classList.toggle("on",!!S.watch[id]);save();render()}
if(t.id==="sv"){S.logs[id]={rating:draft.rating,liked:draft.liked,date:dlg.querySelector("#d").value,review:dlg.querySelector("#r").value.trim()};delete S.watch[id];save();dlg.close();render()}
if(t.id==="rm"){delete S.logs[id];save();dlg.close();render()}
if(t===dlg)dlg.close()});

function addShow(){dlg.dataset.id="";
dlg.innerHTML=`<div class="dh" style="background:#1f3550"><h2>Suggest a show</h2></div>
<div class="db"><label>Title<input id="nt"></label>

<label>Type<select id="ntype"><option value="musical">Musical</option><option value="play">Play</option></select></label>
<p class="sub" id="err" style="color:var(--mute);margin:0"></p>
<div class="btns"><button class="btn p" id="ns">Send suggestion</button><button class="btn" id="cl">Cancel</button></div></div>`;
dlg.querySelector("#ns").onclick=()=>{const t=dlg.querySelector("#nt").value.trim();
if(!t){dlg.querySelector("#err").textContent="Enter the show’s title to send a suggestion.";return}
S.suggest=(S.suggest||[]).concat({title:t,type:dlg.querySelector("#ntype").value});save();dlg.querySelector(".db").innerHTML='<p style="margin:0">Thanks. “'+esc(t)+'” is on your suggestions list.</p><div class="btns"><button class="btn" id="cl">Close</button></div>'};
dlg.showModal()}
render();
</script>
</body>
</html>
